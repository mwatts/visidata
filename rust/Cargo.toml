[workspace]
resolver = "2"
members = [
    "crates/*",
    "bin/*",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal crates
visidata-core = { path = "crates/visidata-core" }
visidata-scripting = { path = "crates/visidata-scripting" }
visidata-tui = { path = "crates/visidata-tui" }
visidata-loaders = { path = "crates/visidata-loaders" }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Scripting
rhai = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Data formats
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = "0.26"
parquet = "54"
arrow = { version = "54", default-features = false, features = ["chrono-tz"] }
scraper = "0.22"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
toml = "0.8"
unicode-width = "0.2"
mimalloc = { version = "0.1", default-features = false }
